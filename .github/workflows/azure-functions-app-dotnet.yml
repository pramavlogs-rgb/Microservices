# This workflow builds each ASP.NET Core microservice and deploys it to its own Azure App Service (Web App).
#
# This workflow assumes you have already created the target Azure Web Apps:
#   - TestMicroservices-UserService
#   - TestMicroservices-PostService
#   - TestMicroservices-AuthService
#
# To configure this workflow:
# 1. Set up the following secret in your repository:
#   - AZURE_RBAC_CREDENTIALS  (Azure Service Principal JSON)
#
# For more information on:
#   - GitHub Actions for Azure: https://github.com/Azure/Actions
#   - Azure Web Apps Deploy Action: https://github.com/Azure/webapps-deploy
#   - Azure Service Principal for RBAC: https://github.com/Azure/login#configure-deployment-credentials

name: Deploy Microservices to Azure Web Apps

on:
  push:
    branches: ["main"]

env:
  DOTNET_VERSION: '10.0.x'   # set this to the dotnet version to use (e.g. '2.1.x', '3.1.x', '5.0.x')

jobs:
  build-and-deploy:
    runs-on: windows-latest
    environment: dev
    permissions:
      contents: read
    steps:
    - name: 'Checkout GitHub Action'
      uses: actions/checkout@v4

    - name: 'Login via Azure CLI'
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_RBAC_CREDENTIALS }} # set up AZURE_RBAC_CREDENTIALS secrets in your repository
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Setup DotNet ${{ env.DOTNET_VERSION }} Environment
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Publish UserService
      shell: pwsh
      run: dotnet publish ./UserService/UserService.csproj -c Release -o ./output/UserService

    - name: Publish PostService
      shell: pwsh
      run: dotnet publish ./PostService/PostService.csproj -c Release -o ./output/PostService

    - name: Publish AuthService
      shell: pwsh
      run: dotnet publish ./AuthService/AuthService.csproj -c Release -o ./output/AuthService

    - name: Deploy UserService Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: TestMicroservices-UserService
        package: ./output/UserService
        resource-group: TestMicroservices-UserService_group

    - name: Deploy PostService Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: TestMicroservices-PostService
        package: ./output/PostService
        resource-group: TestMicroservices-PostService_group

    - name: Deploy AuthService Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: TestMicroservices-AuthService
        package: ./output/AuthService
        resource-group: TestMicroservices-AuthService_group
